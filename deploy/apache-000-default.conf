<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    RedirectMatch 301 ^/pli-hub$ /pli-hub/
    ProxyPass /pli-hub/ http://host.docker.internal:8080/pli-hub/ retry=0 timeout=300 Keepalive=On
    ProxyPassReverse /pli-hub/ http://host.docker.internal:8080/pli-hub/

    ProxyPass / http://127.0.0.1:8000/ retry=0 timeout=300 Keepalive=On
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/sra-error.log
    CustomLog ${APACHE_LOG_DIR}/sra-access.log combined
</VirtualHost>
