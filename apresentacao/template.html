<title>Portfólio PLI Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --ground:   #061a26;
    --ground-2: #04131c;
    --surface:  #0c2939;
    --surface-2:#103246;
    --rule:     #1a465f;
    --text:     #e8f1f6;
    --muted:    #8fb0c2;
    --dim:      #5d8296;
    --blue:     #3aa6d9;
    --green:    #3ec26e;
    --amber:    #e0a33a;

    --display: "Archivo", "Segoe UI", system-ui, sans-serif;
    --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground-2);
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- estrutura do deck ---------- */

  .deck {
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce) { .deck { scroll-behavior: auto; } }

  .slide {
    scroll-snap-align: start;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: clamp(1.6rem, 3.6vh, 2.6rem) clamp(1.5rem, 4vw, 3.6rem) 3.9rem;
    background: var(--ground);
    border-bottom: 1px solid var(--rule);
    overflow: hidden;
  }
  .slide::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: var(--cat, var(--blue));
  }

  .slide-head {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: clamp(0.8rem, 2vh, 1.4rem);
  }
  .slide-head .grow { flex: 1; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cat, var(--blue));
  }
  .eyebrow-dim { color: var(--dim); }

  .slide-foot {
    position: absolute;
    left: clamp(1.5rem, 4vw, 3.6rem);
    right: clamp(1.5rem, 4vw, 3.6rem);
    bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    font-family: var(--mono);
    font-size: 0.66rem;
    color: var(--dim);
    border-top: 1px solid var(--rule);
    padding-top: 0.6rem;
    padding-right: 5rem;
  }
  .slide-foot .grow { flex: 1; }

  /* ---------- capa ---------- */

  .cover {
    justify-content: center;
    background:
      radial-gradient(120% 90% at 12% 0%, #0d3549 0%, transparent 62%),
      radial-gradient(90% 70% at 100% 100%, #0a3a34 0%, transparent 55%),
      var(--ground);
  }
  .cover-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
    gap: clamp(2rem, 5vw, 4rem);
    align-items: center;
  }
  .cover h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(3.2rem, 9vw, 7.4rem);
    line-height: 0.9;
    letter-spacing: -0.035em;
    margin: 0.6rem 0 1rem;
  }
  .cover h1 em { font-style: normal; color: var(--blue); }
  .cover .lede {
    font-size: clamp(1rem, 1.9vw, 1.35rem);
    color: var(--muted);
    max-width: 32ch;
    font-weight: 300;
    margin: 0 0 2rem;
  }
  .cover-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--dim);
  }
  .cover-meta b { display: block; color: var(--text); font-weight: 500; margin-top: 0.25rem; }

  .indice { display: flex; flex-direction: column; gap: 1.3rem; }
  .indice > .eyebrow { color: var(--dim); }
  .indice-cat { border-top: 2px solid var(--c); padding-top: 0.65rem; }
  .indice-cat h4 {
    font-family: var(--display);
    font-size: 1rem;
    font-weight: 600;
    color: var(--c);
    margin: 0 0 0.45rem;
  }
  .indice-cat ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.2rem; }
  .indice-cat li { color: var(--muted); font-size: 0.92rem; }

  /* ---------- tipografia geral ---------- */

  h2.slide-title {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(1.8rem, 3.6vw, 2.9rem);
    line-height: 1.02;
    letter-spacing: -0.025em;
    margin: 0;
    text-wrap: balance;
  }
  .extenso {
    font-size: clamp(0.9rem, 1.25vw, 1.02rem);
    color: var(--muted);
    font-weight: 300;
    margin: 0.55rem 0 0;
    max-width: 42ch;
  }
  .resumo {
    font-size: clamp(0.94rem, 1.3vw, 1.06rem);
    line-height: 1.5;
    max-width: 42ch;
    margin: 1.1rem 0 0;
  }
  .papel {
    display: inline-block;
    margin-top: 1.2rem;
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(0.95rem, 1.35vw, 1.1rem);
    color: var(--cat, var(--blue));
    border-left: 3px solid var(--cat, var(--blue));
    padding-left: 0.75rem;
    line-height: 1.3;
  }

  /* ---------- slide de aplicação ---------- */

  .app-body {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 0.86fr) minmax(0, 1.14fr);
    gap: clamp(1.4rem, 3vw, 2.8rem);
    align-content: center;
  }
  .col-dir { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }

  /* moldura de captura de tela */
  figure.shot {
    margin: 0;
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.34);
  }
  .shot-bar {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.4rem 0.65rem;
    border-bottom: 1px solid var(--rule);
    background: var(--surface-2);
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--dim);
  }
  .shot-bar .dots { display: flex; gap: 0.28rem; }
  .shot-bar .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
  .shot img {
    display: block;
    width: 100%;
    height: clamp(180px, 40vh, 360px);
    object-fit: cover;
    object-position: top center;
  }
  .shot figcaption {
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--dim);
    padding: 0.42rem 0.65rem;
    border-top: 1px solid var(--rule);
  }
  .sem-shot {
    border: 1px dashed var(--rule);
    border-radius: 4px;
    padding: 1.1rem 1.2rem;
    color: var(--dim);
    font-size: 0.88rem;
    line-height: 1.45;
    background: rgba(255, 255, 255, 0.015);
  }
  .sem-shot b { color: var(--amber); font-weight: 600; display: block; margin-bottom: 0.25rem; font-family: var(--display); }

  .entrega h3 {
    font-family: var(--mono);
    font-size: 0.64rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 0.7rem;
    font-weight: 500;
  }
  ul.destaques {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  ul.destaques li {
    display: grid;
    grid-template-columns: 1.2rem 1fr;
    align-items: start;
    font-size: clamp(0.82rem, 1.1vw, 0.94rem);
    line-height: 1.4;
    color: #d3e3ec;
  }
  ul.destaques li::before {
    content: "";
    width: 0.72rem;
    height: 1px;
    background: var(--cat, var(--blue));
    margin-top: 0.7em;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 1.3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--rule);
  }
  .chip {
    font-family: var(--mono);
    font-size: 0.63rem;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 0.22rem 0.45rem;
    white-space: nowrap;
  }

  .status {
    font-family: var(--mono);
    font-size: 0.64rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.26rem 0.55rem;
    border-radius: 2px;
  }
  .status-ok  { color: #0a2a16; background: var(--green); }
  .status-off { color: #2a1408; background: var(--amber); }

  /* ---------- panorama ---------- */

  .panorama {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(1rem, 2.5vw, 2rem);
    align-content: start;
  }
  .col-cat { border-top: 3px solid var(--c); padding-top: 1rem; }
  .col-cat h3 {
    font-family: var(--display);
    font-size: clamp(1rem, 1.6vw, 1.25rem);
    font-weight: 600;
    margin: 0 0 0.2rem;
    color: var(--c);
    line-height: 1.15;
  }
  .col-cat .qtd { font-family: var(--mono); font-size: 0.68rem; color: var(--dim); }
  .col-cat ol {
    list-style: none;
    margin: 1rem 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .col-cat li {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    font-size: clamp(0.86rem, 1.2vw, 0.98rem);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.5rem;
  }
  .col-cat li .n { font-family: var(--mono); font-size: 0.66rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .col-cat li .st { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; }
  .st-ok { background: var(--green); }
  .st-off { background: var(--amber); }

  .numeros {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(1.5rem, 4vw, 3.4rem);
    margin-bottom: clamp(1rem, 2.4vh, 1.8rem);
    padding-bottom: clamp(1rem, 2.4vh, 1.6rem);
    border-bottom: 1px solid var(--rule);
  }
  .numero .v {
    font-family: var(--display);
    font-size: clamp(2rem, 4vw, 3.1rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .numero .k {
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-top: 0.4rem;
  }

  /* ---------- módulos do SIGMA ---------- */

  .mod-body {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 0.82fr) minmax(0, 2fr);
    gap: clamp(1.4rem, 3vw, 2.6rem);
    align-content: center;
  }
  .modulos {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.6rem;
    align-content: start;
  }
  .modulo {
    border: 1px solid var(--rule);
    border-left: 3px solid var(--blue);
    border-radius: 2px;
    padding: 0.6rem 0.75rem;
    background: var(--surface);
  }
  .modulo .cod { font-family: var(--mono); font-size: 0.62rem; color: var(--blue); letter-spacing: 0.08em; }
  .modulo .nm { font-family: var(--display); font-weight: 600; font-size: 0.94rem; margin: 0.1rem 0 0.22rem; }
  .modulo .ds { font-size: 0.78rem; color: var(--muted); line-height: 1.35; }

  /* ---------- integrações ---------- */

  .fluxo { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .fluxo svg { width: 100%; height: auto; max-height: 58vh; }
  .fluxo text { font-family: var(--body); fill: var(--text); }
  .fluxo .lbl { font-family: var(--mono); font-size: 11px; fill: var(--dim); }
  .fluxo .nm { font-family: var(--display); font-size: 17px; font-weight: 600; }
  .fluxo .sub { font-size: 12.5px; fill: var(--muted); }

  /* ---------- encerramento ---------- */

  .fecho {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: clamp(1.2rem, 3vw, 2.4rem);
    align-content: start;
  }
  .fecho .bloco h3 { font-family: var(--display); font-size: 1.1rem; font-weight: 600; margin: 0 0 0.6rem; }
  .fecho .bloco p { margin: 0 0 0.6rem; color: var(--muted); font-size: 0.94rem; line-height: 1.5; }
  .fecho .bloco strong { color: var(--text); font-weight: 600; }

  /* ---------- navegação ---------- */

  .progresso {
    position: fixed;
    bottom: 0; left: 0;
    height: 2px;
    background: var(--muted);
    width: 0;
    z-index: 20;
    transition: width 0.25s ease;
  }
  .nav {
    position: fixed;
    right: clamp(1rem, 2vw, 1.4rem);
    bottom: clamp(0.9rem, 2vw, 1.2rem);
    display: flex;
    gap: 0.4rem;
    z-index: 20;
  }
  .nav button {
    font-family: var(--mono);
    font-size: 0.85rem;
    width: 2.1rem;
    height: 2.1rem;
    border: 1px solid var(--rule);
    background: rgba(6, 26, 38, 0.86);
    color: var(--muted);
    border-radius: 2px;
    cursor: pointer;
    line-height: 1;
  }
  .nav button:hover { color: var(--text); border-color: var(--muted); }
  .nav button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  @media (max-width: 900px) {
    .app-body, .panorama, .cover-grid, .mod-body { grid-template-columns: 1fr; }
    .modulos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .slide { min-height: auto; padding-bottom: 3.6rem; }
    .deck { scroll-snap-type: none; }
  }

  @media print {
    .deck { height: auto; overflow: visible; }
    .slide { page-break-after: always; min-height: 0; height: 19cm; }
    .nav, .progresso { display: none; }
  }
</style>

<div class="progresso" id="progresso"></div>
<div class="deck" id="deck"></div>
<div class="nav">
  <button id="btnPrev" title="Slide anterior" aria-label="Slide anterior">&#8593;</button>
  <button id="btnNext" title="Próximo slide" aria-label="Próximo slide">&#8595;</button>
</div>

<script>
const DADOS = /*DADOS*/;
const IMAGENS = /*IMAGENS*/;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cor = (cat) => DADOS.categorias[cat].cor;
const noAr = (a) => a.status === "no ar";
const statusChip = (a) => noAr(a)
  ? '<span class="status status-ok">no ar</span>'
  : '<span class="status status-off">suspensa</span>';

function rodape(esq, dir, n, total) {
  return `<div class="slide-foot">
    <span>${esc(esq)}</span>
    <span class="grow"></span>
    <span>${esc(dir)}</span>
    <span>${String(n).padStart(2, "0")}/${total}</span>
  </div>`;
}

function captura(chave, url, legenda) {
  const src = IMAGENS[chave];
  if (!src) return "";
  return `<figure class="shot">
    <div class="shot-bar"><span class="dots"><i></i><i></i><i></i></span>${esc(url)}</div>
    <img src="${src}" alt="Captura de tela — ${esc(legenda)}" />
    <figcaption>${esc(legenda)}</figcaption>
  </figure>`;
}

function slideApp(app, i, totalApps, nSlide, totalSlides) {
  const c = cor(app.categoria);
  const cat = DADOS.categorias[app.categoria].nome;
  const visual = app.imagem
    ? captura(app.id, app.url, app.imagem_legenda)
    : `<div class="sem-shot"><b>Sem captura disponível</b>A aplicação está suspensa no Render e não aparece nas capturas do relatório de atividades. A tela entra assim que o serviço for reativado.</div>`;
  return `<section class="slide" style="--cat:${c}">
    <div class="slide-head">
      <span class="eyebrow">Aplicação ${String(i + 1).padStart(2, "0")} / ${totalApps}</span>
      <span class="eyebrow eyebrow-dim">${esc(cat)}</span>
      <span class="grow"></span>
      ${statusChip(app)}
    </div>
    <div class="app-body">
      <div>
        <h2 class="slide-title">${esc(app.nome)}</h2>
        <p class="extenso">${esc(app.extenso)}</p>
        <p class="resumo">${esc(app.resumo)}</p>
        <div class="papel">${esc(app.papel)}</div>
        <div class="chips">${app.stack.map((s) => `<span class="chip">${esc(s)}</span>`).join("")}</div>
      </div>
      <div class="col-dir">
        ${visual}
        <div class="entrega">
          <h3>O que ela entrega</h3>
          <ul class="destaques">
            ${app.destaques.map((d) => `<li><span>${esc(d)}</span></li>`).join("")}
          </ul>
        </div>
      </div>
    </div>
    ${rodape(app.url, cat, nSlide, totalSlides)}
  </section>`;
}

function build() {
  const apps = DADOS.apps;
  const totalApps = apps.length;
  const noArQtd = apps.filter(noAr).length;
  const comShot = apps.filter((a) => a.imagem).length;

  const slides = [];

  // 1 — capa
  slides.push(() => `<section class="slide cover" style="--cat:${cor("major")}">
    <div class="cover-grid">
      <div>
        <span class="eyebrow">${esc(DADOS.org)} · ${esc(DADOS.data)}</span>
        <h1>PLI <em>Hub</em></h1>
        <p class="lede">${esc(DADOS.subtitulo)}</p>
        <div class="cover-meta">
          <div>Aplicações<b>${totalApps} sistemas em 3 categorias</b></div>
          <div>Central de acesso<b>${esc(DADOS.hub_url)}</b></div>
          <div>Responsável técnico<b>${esc(DADOS.autor)}</b></div>
        </div>
      </div>
      <div class="indice">
        <span class="eyebrow">Neste documento</span>
        ${Object.entries(DADOS.categorias).map(([id, cat]) => `<div class="indice-cat" style="--c:${cat.cor}">
          <h4>${esc(cat.nome)}</h4>
          <ul>${apps.filter((a) => a.categoria === id).map((a) => `<li>${esc(a.nome)}</li>`).join("")}</ul>
        </div>`).join("")}
      </div>
    </div>
  </section>`);

  // 2 — panorama
  slides.push((n, t) => {
    const cols = Object.entries(DADOS.categorias).map(([id, cat]) => {
      const lista = apps.filter((a) => a.categoria === id);
      return `<div class="col-cat" style="--c:${cat.cor}">
        <h3>${esc(cat.nome)}</h3>
        <div class="qtd">${lista.length} ${lista.length === 1 ? "aplicação" : "aplicações"}</div>
        <ol>
          ${lista.map((a, k) => `<li><span class="n">${String(k + 1).padStart(2, "0")}</span>${esc(a.nome)}<span class="st ${noAr(a) ? "st-ok" : "st-off"}" title="${noAr(a) ? "no ar" : "suspensa"}"></span></li>`).join("")}
        </ol>
      </div>`;
    }).join("");
    return `<section class="slide" style="--cat:${cor("major")}">
      <div class="slide-head"><span class="eyebrow">Panorama</span></div>
      <h2 class="slide-title">O portfólio em um relance</h2>
      <div class="numeros" style="margin-top:1.4rem">
        <div class="numero"><div class="v">${totalApps}</div><div class="k">aplicações</div></div>
        <div class="numero"><div class="v">3</div><div class="k">categorias</div></div>
        <div class="numero"><div class="v" style="color:var(--green)">${noArQtd}</div><div class="k">no ar hoje</div></div>
        <div class="numero"><div class="v" style="color:var(--amber)">${totalApps - noArQtd}</div><div class="k">suspensas</div></div>
        <div class="numero"><div class="v">${comShot}</div><div class="k">com tela registrada</div></div>
      </div>
      <div class="panorama">${cols}</div>
      ${rodape(DADOS.hub_url, "Panorama", n, t)}
    </section>`;
  });

  // 3 — SIGMA (aplicação 01)
  slides.push((n, t) => slideApp(apps[0], 0, totalApps, n, t));

  // 4 — módulos do SIGMA
  slides.push((n, t) => `<section class="slide" style="--cat:${cor("major")}">
    <div class="slide-head">
      <span class="eyebrow">SIGMA-PLI · por dentro</span>
      <span class="eyebrow eyebrow-dim">${DADOS.modulos_sigma.length} módulos</span>
    </div>
    <h2 class="slide-title">A plataforma central, módulo a módulo</h2>
    <div class="mod-body" style="margin-top:1.2rem">
      <div class="col-dir">
        ${captura("modulos", apps[0].url, DADOS.imagem_modulos_legenda)}
        <p class="extenso" style="margin-top:0.2rem">Cada módulo é uma área funcional própria. Juntos, formam a base sobre a qual as outras aplicações do PLI se apoiam.</p>
      </div>
      <div class="modulos">
        ${DADOS.modulos_sigma.map(([cod, nm, ds]) => `<div class="modulo">
          <div class="cod">${esc(cod)}</div>
          <div class="nm">${esc(nm)}</div>
          <div class="ds">${esc(ds)}</div>
        </div>`).join("")}
      </div>
    </div>
    ${rodape(apps[0].url, "Sistemas Maiores", n, t)}
  </section>`);

  // 5..15 — demais aplicações
  apps.slice(1).forEach((app, k) => {
    slides.push((n, t) => slideApp(app, k + 1, totalApps, n, t));
  });

  // 16 — integrações
  slides.push((n, t) => `<section class="slide" style="--cat:${cor("tools")}">
    <div class="slide-head"><span class="eyebrow">Arquitetura</span></div>
    <h2 class="slide-title">Como as peças conversam</h2>
    <p class="extenso">O portfólio não é um conjunto de sistemas isolados: quatro integrações já em produção ligam sensor, cadastro e decisão.</p>
    <div class="fluxo">${diagrama()}</div>
    ${rodape("4 integrações em produção", "Arquitetura", n, t)}
  </section>`);

  // 17 — situação
  slides.push((n, t) => `<section class="slide" style="--cat:${cor("major")}">
    <div class="slide-head"><span class="eyebrow">Situação e próximos passos</span></div>
    <h2 class="slide-title">Onde o portfólio está hoje</h2>
    <div class="numeros" style="margin-top:1.4rem">
      <div class="numero"><div class="v" style="color:var(--green)">${noArQtd}</div><div class="k">no servidor próprio</div></div>
      <div class="numero"><div class="v" style="color:var(--amber)">${totalApps - noArQtd}</div><div class="k">suspensas no Render</div></div>
      <div class="numero"><div class="v">4</div><div class="k">integrações ativas</div></div>
    </div>
    <div class="fecho">
      <div class="bloco">
        <h3>Infraestrutura própria</h3>
        <p>As ${noArQtd} aplicações dos <strong>Sistemas Maiores</strong> rodam em containers Docker atrás de um Nginx na instância EC2 do PLI, cada uma com seu banco PostgreSQL/PostGIS.</p>
        <p>É a base madura do portfólio: disponível, versionada e integrada.</p>
      </div>
      <div class="bloco">
        <h3>Hospedagem externa</h3>
        <p>As ${totalApps - noArQtd} aplicações de <strong>Análises Exploratórias</strong> e <strong>Ferramentas</strong> estão no Render e hoje respondem <em>Service Suspended</em>.</p>
        <p>Retomá-las exige decidir entre reativar o plano ou migrá-las para a mesma infraestrutura dos sistemas maiores.</p>
      </div>
      <div class="bloco">
        <h3>Próximo passo</h3>
        <p>Concluir a análise aplicação por aplicação e classificar cada uma como <strong>produto, módulo, serviço compartilhado, biblioteca, ferramenta interna ou protótipo</strong>.</p>
        <p>Só então definir a arquitetura da empresa e a estratégia comercial.</p>
      </div>
    </div>
    ${rodape(DADOS.hub_url, DADOS.org + " · " + DADOS.data, n, t)}
  </section>`);

  const total = slides.length;
  document.getElementById("deck").innerHTML = slides.map((f, i) => f(i + 1, total)).join("");
  return total;
}

function diagrama() {
  const LB = 250, HB = 74;
  const col = [0, 375, 750];
  const cx = (x, y, cor2, nome, sub) => `
    <g>
      <rect x="${x}" y="${y}" width="${LB}" height="${HB}" rx="3" fill="#0c2939" stroke="${cor2}" stroke-width="1.5"></rect>
      <rect x="${x}" y="${y}" width="4" height="${HB}" fill="${cor2}"></rect>
      <text class="nm" x="${x + 16}" y="${y + 30}">${nome}</text>
      <text class="sub" x="${x + 16}" y="${y + 51}">${sub}</text>
    </g>`;
  const seta = (x1, y1, x2, y2, rotulo) => `
    <g>
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2b5f7d" stroke-width="1.5" marker-end="url(#p)"></line>
      <text class="lbl" x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 10}" text-anchor="middle">${rotulo}</text>
    </g>`;
  return `<svg viewBox="0 0 1000 480" role="img" aria-label="Diagrama de integração entre as aplicações do PLI">
    <defs>
      <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5f7d"></path>
      </marker>
    </defs>

    <text class="lbl" x="${col[0]}" y="14">SENSORES E COLETA</text>
    ${cx(col[0], 30, "#3aa6d9", "PLI-HazardTrack", "chuva MERGE/INPE → risco por trecho")}
    ${cx(col[0], 152, "#3aa6d9", "PLI Reporta", "relato do cidadão → incidente verificado")}

    <text class="lbl" x="${col[1]}" y="14">OPERAÇÃO</text>
    ${cx(col[1], 91, "#3aa6d9", "PLI Smart Router", "rota que desvia do risco")}

    ${seta(col[0] + LB, 67, col[1], 112, "camadas de risco")}
    ${seta(col[0] + LB, 189, col[1], 144, "GeoJSON")}

    <text class="lbl" x="${col[2]}" y="14">LEITURA DO TERRITÓRIO</text>
    ${cx(col[2], 30, "#3aa6d9", "FAD-Stats 2.0", "IBGE · SECEX · MTE · ANTT")}
    ${cx(col[2], 152, "#e0a33a", "Análises Exploratórias", "sinistralidade e densidade da malha")}

    <text class="lbl" x="${col[0]}" y="316">PLATAFORMA CENTRAL</text>
    ${cx(col[0], 332, "#3ec26e", "SIGMA-PLI", "metadados, identidade e grafo")}

    <text class="lbl" x="${col[1]}" y="316">DECISÃO</text>
    ${cx(col[1], 332, "#3aa6d9", "SICARD", "carteira hierarquizada por AHP")}

    <text class="lbl" x="${col[2]}" y="316">MÉTODO</text>
    ${cx(col[2], 332, "#3ec26e", "AHP Tool Calculator", "pesos e consistência")}

    ${seta(col[0] + LB, 369, col[1], 369, "login e cadastros")}
    ${seta(col[2], 369, col[1] + LB, 369, "método AHP")}
  </svg>`;
}

const total = build();
const deck = document.getElementById("deck");
const barra = document.getElementById("progresso");

function slideAtual() { return Math.round(deck.scrollTop / deck.clientHeight); }
function irPara(i) {
  const alvo = Math.max(0, Math.min(total - 1, i));
  deck.scrollTo({ top: alvo * deck.clientHeight, behavior: "smooth" });
}
function atualizarBarra() {
  barra.style.width = (total > 1 ? (slideAtual() / (total - 1)) * 100 : 100) + "%";
}

deck.addEventListener("scroll", atualizarBarra, { passive: true });
document.getElementById("btnNext").addEventListener("click", () => irPara(slideAtual() + 1));
document.getElementById("btnPrev").addEventListener("click", () => irPara(slideAtual() - 1));
document.addEventListener("keydown", (e) => {
  if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); irPara(slideAtual() + 1); }
  if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); irPara(slideAtual() - 1); }
  if (e.key === "Home") { e.preventDefault(); irPara(0); }
  if (e.key === "End") { e.preventDefault(); irPara(total - 1); }
});
atualizarBarra();
</script>
