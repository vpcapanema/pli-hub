server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 301 /pli-hub/;
    }

    location = /pli-hub {
        return 301 /pli-hub/;
    }

    location /pli-hub/ {
        rewrite ^/pli-hub/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
